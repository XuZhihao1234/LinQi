<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 整个页面内容都包在 page 里，居中、限宽 -->
    <main class="page">

        <!-- ===== 头部：头像 + 名字 + 一句话介绍 + 社交入口 ===== -->
        <section class="hero">
            <!-- 圆形头像占位：等你提供照片后，把 XZ 换成 <img src="头像.jpg"> 即可 -->
            <div class="avatar">XZ</div>

            <h1>你的名字</h1>
            <!-- tagline：一句话介绍自己的身份 / 领域 -->
            <p class="tagline">前端开发 · 内容创作者 · 终身学习者</p>

            <!-- bio：2~3 句自我介绍，用户会在这里真正了解你 -->
            <p class="bio">
                这里写一段简短但有信息量的自我介绍。
                比如你的背景、正在做的事、想找什么样的人交流。
            </p>

            <!-- 社交媒体入口：每一行是"平台名 + 链接"，改成你自己的 -->
            <div class="socials">
                <a class="pill" href="https://github.com/XuZhihao1234" target="_blank">GitHub</a>
                <a class="pill" href="mailto:你的邮箱@example.com">邮箱</a>
                <a class="pill" href="#" target="_blank">微信</a>
                <a class="pill" href="#" target="_blank">哔哩哔哩</a>
                <a class="pill" href="#" target="_blank">微博</a>
            </div>
        </section>

        <!-- ===== 关于我 ===== -->
        <section class="section">
            <h2>关于我</h2>
            <p>
                这里放你的详细自我介绍，可以写 3~4 句话：
                教育或职业背景、擅长的事情、性格特点。
                这一段的风格可以比上面更口语化一点，让人觉得亲切。
            </p>
        </section>

        <!-- ===== 技能 / 兴趣 ===== -->
        <section class="section">
            <h2>技能与兴趣</h2>
            <div class="tags">
                <span class="tag">技能一</span>
                <span class="tag">技能二</span>
                <span class="tag">技能三</span>
                <span class="tag">兴趣一</span>
                <span class="tag">兴趣二</span>
                <span class="tag">兴趣三</span>
            </div>
        </section>

        <!-- ===== 联系我 ===== -->
        <section class="section">
            <h2>联系我</h2>
            <p>想交流、合作或交朋友，欢迎通过这些方式找到我：</p>
            <div class="socials">
                <a class="pill" href="mailto:你的邮箱@example.com">邮箱</a>
                <a class="pill" href="https://github.com/XuZhihao1234" target="_blank">GitHub</a>
            </div>
        </section>

        <!-- 页脚：版权信息 -->
        <footer>
            <p>© 2026 你的名字 · 由 GitHub Pages 免费托管</p>
        </footer>

    </main>
</body>
</html>
