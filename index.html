<!DOCTYPE html>
<!-- 这一行声明：这是一个 HTML5 网页 -->
<html lang="zh-CN">
<head>
    <!-- head 是"头部"，放网页的配置信息，用户看不到 -->
    <meta charset="UTF-8">
    <!-- 上面这行指定文字编码，中文网页必须要有，否则会乱码 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 上面这行让网页在手机上也显示正常 -->
    <title>我的个人主页</title>
    <!-- title 是浏览器标签页上显示的文字 -->
    <link rel="stylesheet" href="style.css">
    <!-- 上面这行把外部的样式文件 style.css 连接进来 -->
</head>
<body>
    <!-- body 是"身体"，用户能看到的所有内容都写在这里 -->

    <!-- 顶部导航栏 -->
    <nav class="navbar">
        <span class="logo">我的主页</span>
        <a href="#about">关于我</a>
        <a href="#projects">项目</a>
        <a href="#contact">联系我</a>
    </nav>

    <!-- 主页大标题区（也叫 Hero 区） -->
    <header class="hero">
        <h1>你好，我是「你的名字」</h1>
        <!-- h1 是最大的一级标题，一般一页只有一个 -->
        <p>这是我的第一个静态网页，由 GitHub Pages 免费托管。</p>
        <a class="btn" href="#contact">和我联系</a>
    </header>

    <!-- 关于我 -->
    <section id="about" class="section">
        <h2>关于我</h2>
        <p>在这里写一段自我介绍。可以介绍你的身份、兴趣、正在学的东西。</p>
        <ul>
            <li>爱好一</li>
            <li>爱好二</li>
            <li>爱好三</li>
        </ul>
    </section>

    <!-- 我的项目 -->
    <section id="projects" class="section">
        <h2>我的项目</h2>
        <div class="cards">
            <div class="card">
                <h3>项目一</h3>
                <p>简单描述这个项目做了什么。</p>
            </div>
            <div class="card">
                <h3>项目二</h3>
                <p>简单描述这个项目做了什么。</p>
            </div>
            <div class="card">
                <h3>项目三</h3>
                <p>简单描述这个项目做了什么。</p>
            </div>
        </div>
    </section>

    <!-- 联系我 -->
    <section id="contact" class="section">
        <h2>联系我</h2>
        <p>邮箱：<a href="mailto:你的邮箱@example.com">你的邮箱@example.com</a></p>
        <p>GitHub：<a href="https://github.com/你的用户名" target="_blank">github.com/你的用户名</a></p>
        <!-- target="_blank" 表示在新标签页打开链接 -->
    </section>

    <!-- 页脚 -->
    <footer>
        <p>© 2026 你的名字 · 由 GitHub Pages 托管</p>
    </footer>
</body>
</html>
